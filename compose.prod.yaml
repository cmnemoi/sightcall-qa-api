name: sightcall

services:
  app:
    image: ${APP_IMAGE}:${IMAGE_TAG}
    restart: always
    ports: ["127.0.0.1:8120:3000"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ENV: production
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    extra_hosts:
      - host.docker.internal:host-gateway
